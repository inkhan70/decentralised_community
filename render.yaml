services:
  - type: web
    name: decentralised-community-hub
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: mongo
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: VERIFICATION_THRESHOLD
        value: "2"
      - key: ALLOWED_ORIGINS
        value: "*"
