[build]
  publish = "frontend"

[functions]
  # Moved here from the [build] section
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # 🔥 THIS IS THE FIX: Tells Netlify not to bundle serverless-http
  external_node_modules = ["serverless-http"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"
